name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test,dev]'
      - run: ruff check paper_trading_codex tests examples
      - run: pytest tests -q --cov=paper_trading_codex --cov-branch --cov-report=term-missing
      - if: matrix.python-version == '3.12'
        run: python -m build
